<style>
:root{--bg:#120a2a;--fg:#fff4e0;--ac:#ff3d81;--ac2:#18e0ff;box-sizing:border-box}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:"Trebuchet MS",Verdana,sans-serif;color:var(--fg);touch-action:manipulation;user-select:none}
canvas{display:block;position:fixed;inset:0}
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 2px 6px #000a}
#top{font-size:15px;opacity:.9}#top span{margin-left:12px;opacity:.7}
#pct{font-size:34px;font-weight:700;line-height:1.1}
#bar{position:relative;width:min(460px,64vw);height:12px;margin:4px auto 0;background:#ffffff22;border-radius:6px;overflow:hidden;border:2px solid #ffffff44}
#fill{height:100%;width:0;background:linear-gradient(90deg,var(--ac2),var(--ac))}
.tk{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px}
#chip{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:4px 14px;border-radius:20px;background:#00000066;font-size:15px}
#dot{width:12px;height:12px;border-radius:3px;background:#fff}#chip em{font-style:normal;color:#7dff9a}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0}
#pop{position:fixed;left:0;right:0;top:24%;text-align:center;font-size:clamp(34px,8vw,64px);font-weight:700;pointer-events:none;opacity:0;text-shadow:0 3px 0 #000a}
#menu.low{justify-content:flex-end;background:#120a2a55}
#menu.solid{background:var(--bg)}
#pbtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;padding:6px 12px;font-size:18px}

<script>
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,matchMedia('(pointer: coarse)').matches?1.5:2));document.body.prepend(renderer.domElement);

const LV=[
 {n:'Start',sp:8,len:180,d:1,h:.93,fm:[0,1]},
 {n:'Neonowe miasto',sp:8.5,len:240,d:3,h:.55,fm:[0,1,2]},

 {n:'Podwodny rejs',sp:9.5,len:360,d:5,h:.6,fm:[3,4,3,0,2]},
 {n:'Pustynna burza',sp:10,len:380,d:6,h:.12,fm:[1,0,1,2,4]},
 {n:'Turbo tunel',sp:10.5,len:420,d:7,h:.33,fm:[4,0,4,1,4]},
 {n:'Zamek burzy',sp:10.5,len:460,d:8,h:.68,fm:[2,3,1,4,0,2]},
 {n:'Ostateczny wymiar',sp:11,len:540,d:9,h:.83,fm:[0,2,4,3,1,4,2,0]}];
// Wyniki są zapisywane według numeru poziomu; BUILTIN_BEFORE to liczba poziomów przed dodaniem nowych.
const BUILTIN_BEFORE=7;
function alignBest(list,saved){const oldN=Number(saved)||BUILTIN_BEFORE;
  if(oldN<LV.length&&list.length>oldN)list.splice(oldN,0,...Array(LV.length-oldN).fill(0));return list}
// formy: 0 kostka, 1 skoczek (wysokie przeszkody), 2 dwuskok, 3 balon, 4 samolot (przeszkody u góry)
const CH=[
 {n:'Kostka',c:0xffd23d,j:15.5,g:-48},
 {n:'Skoczek',c:0x6dff6d,j:20.5,g:-48},
 {n:'Dwuskok',c:0x18e0ff,j:14.5,g:-48,dj:1},
 {n:'Balon',c:0xff7ad9,j:13,g:-26},
 {n:'Samolot',c:0xff8a2a,fly:1}];
let best=[],curForm=0,lvl=0,custom=[],skin={c:0,f:0,t:0,shape:0,finish:0},LVL,att=1,ed=null;
let stats={},coins=0,owned=[],claimed=[];
const ACCOUNT_KEY='d3accounts_v1',DEFAULT_OWNED=['color-0','shape-0','trail-0','face-0','finish-0'];
const freshStats=()=>({jumps:0,doubleJumps:0,levelsCompleted:0,deaths:0,portals:0,attempts:0,
  distance:0,bestPercent:0,trampolines:0,playSeconds:0,flightSeconds:0,coinsEarned:0,coinsSpent:0,shopPurchases:0,mapsCreated:0,sessions:0});
const EMPTY_PROFILE=()=>({best:[],custom:[],skin:{c:0,f:0,t:0,shape:0,finish:0},stats:freshStats(),coins:0,owned:DEFAULT_OWNED.slice(),claimed:[]});
let accounts={users:{}},activeUser=null,guestMode=false,recoverySetupUser=null;
try{const saved=JSON.parse(localStorage.getItem(ACCOUNT_KEY));if(saved&&saved.users)accounts=saved}catch(e){}
const readSaved=(key,fallback)=>{try{const value=JSON.parse(localStorage.getItem(key));return value==null?fallback:value}catch(e){return fallback}};
function legacyProfile(){return{...EMPTY_PROFILE(),best:readSaved('d3best',[]),custom:readSaved('d3custom',[]),skin:{c:0,f:0,t:0,shape:0,finish:0,...readSaved('d3skin',{})}}}
function storeAccounts(){try{localStorage.setItem(ACCOUNT_KEY,JSON.stringify(accounts));return true}catch(e){return false}}
const storageWorks=(()=>{try{localStorage.setItem('d3test','1');localStorage.removeItem('d3test');return true}catch(e){return false}})();
addEventListener('pagehide',()=>persistProfile());document.addEventListener('visibilitychange',()=>{if(document.hidden)persistProfile()});
setInterval(()=>{if(activeUser)persistProfile()},15000);
const PROFILE_KEY='d3profile_v1';
function persistProfile(){
  if(!activeUser)return false;
  try{localStorage.setItem(PROFILE_KEY,JSON.stringify({best,custom,skin,stats,coins,owned,claimed,lvCount:LV.length}));return true}catch(e){return false}
}
function loadLocalProfile(){
  let data=readSaved(PROFILE_KEY,null);
  if(!data){const first=Object.values(accounts.users||{}).find(u=>u&&u.data);data=first?first.data:legacyProfile()}
  accounts.users.local={name:'Gracz',data};enterAccount('local');
}
const saveBest=()=>persistProfile();
const sv=(k,v)=>{if(k==='d3custom')custom=v;if(k==='d3skin')skin=v;return persistProfile()};
const PAL=[0,0xff3d81,0x6dff6d,0x18e0ff,0xffd23d,0xb06bff,0xffffff,0xff8a2a,0x2d2d3a];
const hx=c=>'#'+c.toString(16).padStart(6,'0'),pcol=()=>skin.c?PAL[skin.c]:CH[curForm].c,ALL=()=>LV.concat(custom);
const COLOR_NAMES=['Auto','Róż neonowy','Limonkowy','Błękitny','Złoty','Fioletowy','Perłowy','Pomarańczowy','Grafitowy'];
const SHOP_ITEMS=[
 {id:'color-0',kind:'color',value:0,name:'Kolor automatyczny',price:0},
 ...COLOR_NAMES.slice(1).map((name,i)=>({id:'color-'+(i+1),kind:'color',value:i+1,name,price:35+(i%4)*10})),
 {id:'shape-0',kind:'shape',value:0,name:'Kostka klasyczna',price:0},
 {id:'shape-1',kind:'shape',value:1,name:'Sześcian ścięty',price:80},
 {id:'shape-2',kind:'shape',value:2,name:'Kryształ',price:100},
 {id:'shape-3',kind:'shape',value:3,name:'Kula',price:120},
 {id:'shape-4',kind:'shape',value:4,name:'Gwiazda',price:140},
 {id:'shape-5',kind:'shape',value:5,name:'Kostka kolczasta',price:160},
 {id:'trail-0',kind:'trail',value:0,name:'Zwykły ślad',price:0},
 {id:'trail-1',kind:'trail',value:1,name:'Tęczowy ślad',price:55},
 {id:'trail-2',kind:'trail',value:2,name:'Bez śladu',price:25},
 {id:'trail-3',kind:'trail',value:3,name:'Iskry',price:75},
 {id:'trail-4',kind:'trail',value:4,name:'Widmowy ślad',price:95},
 {id:'face-0',kind:'face',value:0,name:'Oczy',price:0},
 {id:'face-1',kind:'face',value:1,name:'Wizjer',price:35},
 {id:'face-2',kind:'face',value:2,name:'Bez twarzy',price:25},
 {id:'face-3',kind:'face',value:3,name:'Złote oczy',price:65},
 {id:'finish-0',kind:'finish',value:0,name:'Matowe wykończenie',price:0},
 {id:'finish-1',kind:'finish',value:1,name:'Metaliczne wykończenie',price:110},
 {id:'finish-2',kind:'finish',value:2,name:'Kryształowe wykończenie',price:130},
 {id:'finish-3',kind:'finish',value:3,name:'Neonowe wykończenie',price:150}
];

const mats={spike:new THREE.MeshStandardMaterial({flatShading:true}),block:new THREE.MeshStandardMaterial({flatShading:true}),
 gnd:new THREE.MeshStandardMaterial(),edge:new THREE.LineBasicMaterial({color:0xfff4e0})};
const world=new THREE.Group();scene.add(world);
let obs=[],segs=[],portals=[],LEN=180,SP=8,hue=0;

function build(L){
  LEN=L.len;SP=L.sp;hue=L.h;obs=[];segs=[];
  while(world.children.length)world.remove(world.children[0]);
  const col=(h,s,l)=>new THREE.Color().setHSL(((h%1)+1)%1,s,l);
  scene.background=col(hue,.55,.08);scene.fog=new THREE.Fog(scene.background,25,90);
  mats.spike.color=col(hue,1,.6);mats.spike.emissive=col(hue,1,.2);
  mats.block.color=col(hue+.5,1,.55);mats.block.emissive=col(hue+.5,1,.12);
  mats.gnd.color=col(hue,.5,.2);
  const r=document.documentElement.style;
  r.setProperty('--ac','hsl('+hue*360+',100%,62%)');r.setProperty('--ac2','hsl('+(hue*360+180)+',100%,58%)');
  let seed=11+LV.indexOf(L)*97;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const sp=x=>obs.push({t:'s',x,w:1,y0:0,y1:.9}),bl=(x,h,w=1)=>obs.push({t:'b',x,w,y0:0,y1:h});
  const pad=(x,pw)=>obs.push({t:'j',x,w:1,y0:0,y1:.25,pw}),run=(x,n)=>{for(let k=0;k<n;k++)sp(x+k)},st=(x,n,h,w)=>{for(let k=0;k<n;k++)bl(x+k*w,(k+1)*h,w)};
  const PT=[
   [[1,x=>sp(x)],[2,x=>run(x,2)],[15,x=>{st(x,3,1,4);sp(x+13)}],[12,x=>{pad(x,23);run(x+3,3)}],[3,x=>run(x,3)],[4.2,x=>{bl(x,1);sp(x+3.2)}],[5,x=>{bl(x,1,3);sp(x+4)}],
    [6.5,x=>{bl(x,1);bl(x+2.5,2);sp(x+5.5)}],[6,x=>{bl(x,1,2);run(x+2,2);bl(x+4,1,2)}],[9,x=>{sp(x);sp(x+4);sp(x+8)}],[6,x=>{bl(x,1,4);run(x+4,2)}]],
   [[1,x=>bl(x,3.5)],[17,x=>{st(x,4,1.5,3.5);run(x+15,2)}],[4,x=>run(x,4)],[7.5,x=>{bl(x,2.5,1.5);bl(x+3,3.5,1.5);sp(x+6)}],[8,x=>{bl(x,3,4);sp(x+6)}],[10,x=>{run(x,2);bl(x+4.5,3.2,2);sp(x+9.5)}]],
   [[5,x=>run(x,5)],[14,x=>{st(x,3,1.5,3.5);sp(x+12)}],[5,x=>{bl(x,3);sp(x+4)}],[9,x=>{run(x,2);bl(x+4,2.6,2);run(x+7,2)}],[4,x=>run(x,4)]],
   [[6,x=>run(x,6)],[18,x=>{st(x,4,1,4);sp(x+16)}],[11,x=>{sp(x);bl(x+4,2.5,3);sp(x+8)}],[11,x=>{bl(x,1,2);bl(x+2,2,2);bl(x+4,3,2);sp(x+8.5)}],[4,x=>run(x,4)]]];
  if(L.items){
    const pr=L.items.filter(o=>o.t==='p').sort((a,b)=>a.x-b.x);let a=0,f=0;
    pr.forEach(q=>{segs.push({a,b:q.x,f});a=q.x;f=q.f});segs.push({a,b:LEN+100,f});
    L.items.forEach(o=>{if(o.t==='s')obs.push({t:'s',x:o.x,w:1,y0:o.y,y1:o.y+.9});else if(o.t==='b')obs.push({t:'b',x:o.x,w:1,y0:o.y,y1:o.y+1});
      else if(o.t==='j'||o.t==='u')obs.push({t:'j',x:o.x,w:1,y0:o.y,y1:o.y+.25,pw:o.t==='u'?31:23});
      else if(o.t==='v')obs.push({t:'v',x:o.x,w:1,y0:o.y,y1:o.y+1});
      else if(o.t==='d'){const m=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(hue+.25,.8,.5),transparent:true,opacity:.45}));m.position.set(o.x+.5,o.y+.5,-1.8);world.add(m)}});
  }else{
    const n=L.fm.length,w=LEN/n,gap=4.3-L.d*.15;
    L.fm.forEach((f,k)=>segs.push({a:k*w,b:k<n-1?(k+1)*w:LEN+100,f}));
    segs.forEach(({a,b,f})=>{const e=Math.min(b,LEN);
      if(f===4){let bb=2;for(let x=a+10;x<e-10;x+=8.5){bb=clamp(bb+(rnd()-.5)*5,.4,9-gap-.4);
        obs.push({t:'b',x,w:1.5,y0:0,y1:bb});obs.push({t:'b',x,w:1.5,y0:bb+gap,y1:9})}}
      else{const list=PT[f];let cx=Math.max(22,a+10);
        while(cx<e-14){const [len,fn]=list[Math.floor(rnd()*Math.min(list.length,L.d+2))];fn(cx);cx+=len+9-L.d*.25+rnd()*2.5}}
    });
  }
  portals=[];const bar=$('bar');bar.querySelectorAll('.tk').forEach(x=>x.remove());
  segs.forEach(({a,b,f},k)=>{const e=Math.min(b,LEN);
    if(k){const t=new THREE.Mesh(new THREE.TorusGeometry(4.5,.15,8,32),new THREE.MeshBasicMaterial({color:CH[f].c}));
      t.rotation.y=Math.PI/2;t.position.set(a,4.5,0);world.add(t);portals.push(t);
      const tk=document.createElement('i');tk.className='tk';tk.style.left=(a/LEN*100)+'%';tk.style.background=hx(CH[f].c);bar.append(tk)}
    if(f===4){const cl=new THREE.Mesh(new THREE.BoxGeometry(e-a,.4,6),mats.gnd);cl.position.set((a+e)/2,9.2,0);world.add(cl)}
  });
  const gnd=new THREE.Mesh(new THREE.BoxGeometry(LEN+100,1,6),mats.gnd);gnd.position.set(LEN/2,-.5,0);world.add(gnd);
  const grid=new THREE.GridHelper(LEN+100,LEN+100,col(hue,1,.5),col(hue+.05,.6,.3));grid.scale.z=.06;grid.position.set(LEN/2,.01,0);world.add(grid);
  for(const z of[-3,3]){const l=new THREE.Mesh(new THREE.BoxGeometry(LEN+100,.15,.15),new THREE.MeshBasicMaterial({color:col(hue+.5,1,.55)}));l.position.set(LEN/2,.07,z);world.add(l)}
  obs.forEach(o=>{let m;
    if(o.t==='j'){m=new THREE.Mesh(new THREE.BoxGeometry(1,.25,2.2),new THREE.MeshBasicMaterial({color:o.pw>25?0xb06bff:0xffe14a}));m.position.set(o.x+.5,o.y0+.125,0)}
    else if(o.t==='v'){m=new THREE.Mesh(new THREE.ConeGeometry(.5,.95,4),mats.spike);m.rotation.x=Math.PI;m.position.set(o.x+.5,o.y0+.52,0);m.scale.set(1.1,1,3)}
    else if(o.t==='s'){m=new THREE.Mesh(new THREE.ConeGeometry(.5,.95,4),mats.spike);m.rotation.y=Math.PI/4;m.position.set(o.x+.5,o.y0+.47,0);m.scale.set(1.1,1,3)}
    else{const h=o.y1-o.y0;m=new THREE.Mesh(new THREE.BoxGeometry(o.w,h,2.2),mats.block);m.position.set(o.x+o.w/2,o.y0+h/2,0);
      m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),mats.edge))}
    world.add(m)});
  const fin=new THREE.Mesh(new THREE.BoxGeometry(1,12,6),new THREE.MeshBasicMaterial({color:0xfff4e0}));fin.position.set(LEN,6,0);world.add(fin);
  $('lvn').textContent=L.n;
}

// player
let player;const P={x:0,y:0,vy:0,rot:0,jumps:0};
function mkPlayer(i){

  box.className='authBox';code.className='recoveryPin';code.textContent=pin;
  note.className='authHint';note.textContent='Zapisz ten kod teraz. Nie będzie ponownie wyświetlony. Aby odzyskać hasło, wystarczy nazwa użytkownika i ten PIN albo imię zwierzaka. Unikalność PIN-u dotyczy kont zapisanych w tej przeglądarce.';
  box.append(code,note);
  scr('ZAPISZ KOD ODZYSKIWANIA','Twój unikalny PIN na tym urządzeniu:',[['Kopiuj PIN',()=>{if(navigator.clipboard)navigator.clipboard.writeText(pin).catch(()=>{})},1],['Zapisałem PIN',main]],box);
}
function authScreen(mode='login',message=''){
  stopMusic();$('touchBtn').classList.add('hide');$('mbtn').classList.add('hide');state='menu';
  const box=document.createElement('div'),form=document.createElement('form');box.className='authBox';
  const field=(label,name,type,autocomplete)=>{const l=document.createElement('label');l.textContent=label;const i=document.createElement('input');i.name=name;i.type=type;i.autocomplete=autocomplete;i.required=true;l.append(i);form.append(l);return i};
  let username=null,password=null,petName=null,pinInput=null,newPassword=null,confirm=null;
  if(mode!=='setupRecovery'){username=field('Nazwa użytkownika','username','text','username');username.minLength=3;username.maxLength=20}
  let method='pin';
  if(mode==='recover'){const pick=document.createElement('div');pick.className='row';
    const mk=(m,t)=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.onclick=()=>{method=m;sync()};pick.append(b);return b};
    const bPin=mk('pin','Mam PIN'),bPet=mk('pet','Pamiętam imię zwierzaka');form.append(pick);
    pinInput=field('6-cyfrowy PIN','pin','text','one-time-code');pinInput.inputMode='numeric';pinInput.maxLength=6;
    petName=field('Imię Twojego zwierzaka','petName','text','off');petName.maxLength=40;
    var sync=()=>{const p=method==='pin';bPin.className=p?'':'sec';bPet.className=p?'sec':'';
      pinInput.parentElement.style.display=p?'':'none';petName.parentElement.style.display=p?'none':'';
      pinInput.required=p;petName.required=!p;status.textContent=''};}
  else if(mode==='register'||mode==='setupRecovery'){petName=field('Imię Twojego zwierzaka','petName','text','off');petName.maxLength=40}
  if(mode==='login'||mode==='register'){password=field('Hasło','password','password',mode==='login'?'current-password':'new-password');password.minLength=8}
  if(mode==='recover'){newPassword=field('Nowe hasło','newPassword','password','new-password');newPassword.minLength=8}
  if(mode==='register'||mode==='recover'){confirm=field('Powtórz hasło','confirm','password','new-password');confirm.minLength=8}
  const status=document.createElement('div');status.className='authStatus';status.setAttribute('role','alert');status.textContent=message;
  if(mode==='recover')sync();
  const note=document.createElement('div');note.className='authHint';note.textContent=mode==='recover'?'Podaj nazwę użytkownika i jedno z dwóch: PIN albo imię zwierzaka podane przy rejestracji. Po 5 błędnych próbach odzyskiwanie blokuje się na 15 minut.':(storageWorks?'Konto i zapis gry działają w tej przeglądarce na tym urządzeniu. Hasło nie jest przechowywane w jawnej postaci.':'Uwaga: ta przeglądarka blokuje zapis danych (np. tryb prywatny albo podgląd pliku). Otwórz plik w zwykłej przeglądarce, np. Chrome, aby konto się zapisało.');
  const submit=document.createElement('button');submit.type='submit';submit.textContent=mode==='login'?'Zaloguj się':mode==='register'?'Utwórz konto':mode==='recover'?'Ustaw nowe hasło':'Zapisz dane odzyskiwania';
  form.append(status,submit);form.addEventListener('submit',async e=>{
    e.preventDefault();submit.disabled=true;status.textContent='Chwileczkę…';
    try{
      if(!window.crypto||!crypto.subtle){status.textContent='Bezpieczne logowanie wymaga nowoczesnej przeglądarki.';return}
      const name=username?username.value.trim():'',keyName=name.toLocaleLowerCase('pl-PL'),pass=password?password.value:'';
      if(mode==='setupRecovery'){
        const pin=await installRecovery(recoverySetupUser,petName.value);const key=recoverySetupUser;recoverySetupUser=null;enterAccount(key);showRecoveryPin(pin);return;
      }
      if(mode==='register'){
        if(!/^[\p{L}\p{N}_-]{3,20}$/u.test(name)||['__proto__','constructor','prototype'].includes(keyName)){status.textContent='Nazwa: 3–20 liter, cyfr, myślników lub podkreśleń.';return}
        if(!normalizePetName(petName.value)){status.textContent='Wpisz imię swojego zwierzaka.';return}
        if(pass.length<8){status.textContent='Hasło musi mieć co najmniej 8 znaków.';return}
        if(pass!==confirm.value){status.textContent='Hasła nie są takie same.';return}
        if(Object.prototype.hasOwnProperty.call(accounts.users,keyName)){status.textContent='Ta nazwa użytkownika jest już zajęta.';return}
        const salt=crypto.getRandomValues(new Uint8Array(16));
        const initial=Object.keys(accounts.users).length?EMPTY_PROFILE():legacyProfile();
        accounts.users[keyName]={name,salt:encodeBytes(salt),hash:encodeBytes(await passwordHash(pass,salt)),data:initial};
        try{const pin=await installRecovery(keyName,petName.value);enterAccount(keyName);showRecoveryPin(pin);return}
        catch(e){delete accounts.users[keyName];storeAccounts();status.textContent='Nie udało się zapisać konta i kodu odzyskiwania.';return}
      }
      if(mode==='recover'){
        if(method==='pin'&&!/^\d{6}$/.test(pinInput.value.trim())){status.textContent='Wpisz 6-cyfrowy PIN.';return}
        if(method==='pet'&&!normalizePetName(petName.value)){status.textContent='Wpisz imię swojego zwierzaka.';return}
        if(newPassword.value.length<8){status.textContent='Nowe hasło musi mieć co najmniej 8 znaków.';return}
        if(newPassword.value!==confirm.value){status.textContent='Hasła nie są takie same.';return}
        const account=Object.prototype.hasOwnProperty.call(accounts.users,keyName)?accounts.users[keyName]:null;
        if(!account||!account.recoveryTag||!account.petSalt||!account.petHash){status.textContent='Nie znaleziono danych odzyskiwania dla tego konta.';return}
        if(account.lockUntil&&Date.now()<account.lockUntil){status.textContent='Za dużo błędnych prób. Spróbuj ponownie za '+Math.ceil((account.lockUntil-Date.now())/60000)+' min.';return}
        const okSecret=method==='pin'?await recoveryTag(pinInput.value.trim())===account.recoveryTag
          :equalBytes(await passwordHash(normalizePetName(petName.value),decodeBytes(account.petSalt)),decodeBytes(account.petHash));
        if(!okSecret){account.failed=(account.failed||0)+1;if(account.failed>=5){account.failed=0;account.lockUntil=Date.now()+15*60000}storeAccounts();
          status.textContent=method==='pin'?'Nazwa użytkownika lub PIN są nieprawidłowe.':'Nazwa użytkownika lub imię zwierzaka są nieprawidłowe.';return}
        account.failed=0;account.lockUntil=0;
        const oldSalt=account.salt,oldHash=account.hash,newSalt=crypto.getRandomValues(new Uint8Array(16));
        account.salt=encodeBytes(newSalt);account.hash=encodeBytes(await passwordHash(newPassword.value,newSalt));
        if(!storeAccounts()){account.salt=oldSalt;account.hash=oldHash;status.textContent='Nie udało się zapisać nowego hasła.';return}
        authScreen('login','Hasło zmienione. Zaloguj się nowym hasłem.');return;
      }
      const account=Object.prototype.hasOwnProperty.call(accounts.users,keyName)?accounts.users[keyName]:null;
      if(!account){status.textContent='Nie znaleziono takiego konta.';return}
      const entered=await passwordHash(pass,decodeBytes(account.salt));
      if(!equalBytes(entered,decodeBytes(account.hash))){status.textContent='Nieprawidłowa nazwa użytkownika lub hasło.';return}
      if(!account.recoveryTag||!account.petHash){recoverySetupUser=keyName;authScreen('setupRecovery','Dodaj imię zwierzaka, aby otrzymać kod odzyskiwania.');return}
      enterAccount(keyName);
    }catch(e){status.textContent='Nie udało się zalogować. Spróbuj ponownie w tej przeglądarce.'}
    finally{submit.disabled=false}
  });
  box.append(form,note);
  let actions=[],title='DASH 3D',intro='Zaloguj się albo utwórz konto.';
  if(mode==='login')actions=[['Utwórz konto',()=>authScreen('register'),1],['Zapomniałem hasła',()=>authScreen('recover'),1],['Graj jako gość',startGuest,1]];
  else if(mode==='register'){intro='Utwórz konto gracza.';actions=[['Mam już konto',()=>authScreen('login'),1],['Graj jako gość',startGuest,1]]}
  else if(mode==='recover'){title='ODZYSKIWANIE HASŁA';intro='Ustaw nowe hasło bez adresu e-mail.';actions=[['Wróć do logowania',()=>authScreen('login'),1]]}
  else{title='ZABEZPIECZ KONTO';intro='Dodaj dane odzyskiwania, aby móc resetować hasło.'}
  scr(title,intro,actions,box);if(username)username.focus();else if(petName)petName.focus();
}
function enterAccount(keyName){
  const data=accounts.users[keyName].data||EMPTY_PROFILE();activeUser=keyName;guestMode=false;
  best=alignBest(Array.isArray(data.best)?data.best:[],data.lvCount);custom=Array.isArray(data.custom)?data.custom:[];
  skin={c:0,f:0,t:0,shape:0,finish:0,...(data.skin||{})};stats={...freshStats(),...(data.stats||{})};
  coins=Math.max(0,Number(data.coins)||0);owned=Array.isArray(data.owned)?[...new Set(DEFAULT_OWNED.concat(data.owned))]:DEFAULT_OWNED.slice();
  ['color','shape','trail','face','finish'].forEach(kind=>{const field=cosmeticField({kind}),id=kind+'-'+skin[field];if(SHOP_ITEMS.some(item=>item.id===id)&&!owned.includes(id))owned.push(id)});
  claimed=Array.isArray(data.claimed)?data.claimed:[];stats.sessions=(stats.sessions||0)+1;persistProfile();main();
}
function startGuest(){activeUser=null;guestMode=true;best=[];custom=[];skin={c:0,f:0,t:0,shape:0,finish:0};stats=freshStats();stats.sessions=1;coins=0;owned=DEFAULT_OWNED.slice();claimed=[];main()}
function logout(){persistProfile();activeUser=null;guestMode=false;best=[];custom=[];skin={c:0,f:0,t:0,shape:0,finish:0};stats=freshStats();coins=0;owned=DEFAULT_OWNED.slice();claimed=[];authScreen('login','Wylogowano. Zaloguj się lub wybierz grę jako gość.')}

function checkAchievements(){
  const earned=ACHIEVEMENTS.filter(a=>!claimed.includes(a.id)&&(stats[a.stat]||0)>=a.target);
  if(!earned.length)return;
  earned.forEach(a=>{claimed.push(a.id);coins+=a.reward;stats.coinsEarned=(stats.coinsEarned||0)+a.reward});
  persistProfile();if(state==='play')pop('OSIĄGNIĘCIE! +'+earned.reduce((n,a)=>n+a.reward,0)+' monet','#ffe14a');
}

function cosmeticField(item){return({color:'c',shape:'shape',trail:'t',face:'f',finish:'finish'})[item.kind]}
function isOwned(item){return owned.includes(item.id)}
function equipItem(item){
  if(!isOwned(item)){
    if(coins<item.price){shopScreen('Brakuje '+(item.price-coins)+' monet. Wykonuj wyzwania, aby je zdobyć.');return}
    coins-=item.price;stats.coinsSpent=(stats.coinsSpent||0)+item.price;stats.shopPurchases=(stats.shopPurchases||0)+1;owned.push(item.id);
  }
  skin[cosmeticField(item)]=item.value;mkPlayer(curForm);checkAchievements();persistProfile();shopScreen();

function edui(){

  const nameLabel=document.createElement('label'),nameInput=document.createElement('input');nameLabel.className='levelName';nameLabel.textContent='Nazwa poziomu';

  nameInput.addEventListener('input',()=>{ed.n=nameInput.value.slice(0,32)});nameLabel.append(nameInput);

    g.fillStyle='#ffffff12';g.fillRect(0,0,Math.max(0,8-ed.off)*cs,cv.height);

    for(let j=0;j<=R;j++){g.beginPath();g.moveTo(0,j*cs);g.lineTo(cv.width,j*cs);g.stroke()}
    g.fillStyle='#fff';g.fillRect(0,R*cs-2,cv.width,2);g.fillStyle='#ffffff55';g.fillRect(0,(R-9)*cs,cv.width,1);

      if(o.t==='p'){g.fillStyle=hx(CH[o.f].c)+'cc';g.fillRect(px+cs/2-3,0,6,cv.height);g.fillStyle='#fff';g.font='bold 14px sans-serif';g.fillText(CH[o.f].n[0],px+cs/2-5,16)}
      else{const py=(R-1-o.y)*cs;if(o.t==='b'){g.fillStyle='#18e0ff';g.fillRect(px+1,py+1,cs-2,cs-2)}
        else if(o.t==='j'||o.t==='u'){g.fillStyle=o.t==='u'?'#b06bff':'#ffe14a';g.fillRect(px+1,py+cs-7,cs-2,6)}else if(o.t==='d'){g.fillStyle='#ffffff44';g.fillRect(px+1,py+1,cs-2,cs-2)}else if(o.t==='v'){g.fillStyle='#ff3d81';g.beginPath();g.moveTo(px+2,py+1);g.lineTo(px+cs/2,py+cs-3);g.lineTo(px+cs-2,py+1);g.fill()}else{g.fillStyle='#ff3d81';g.beginPath();g.moveTo(px+2,py+cs-1);g.lineTo(px+cs/2,py+3);g.lineTo(px+cs-2,py+cs-1);g.fill()}}});
    g.fillStyle='#fff4e0';g.font='13px sans-serif';g.fillText('kratki '+ed.off+' do '+(ed.off+cols),6,cv.height-8)};
  const put=e=>{const r=cv.getBoundingClientRect(),k=cv.width/r.width,x=ed.off+Math.floor((e.clientX-r.left)*k/cs),y=R-1-Math.floor((e.clientY-r.top)*k/cs);
    if(x<8)return;
    ed.items=ed.items.filter(o=>!(o.x===x&&(o.t==='p'?ed.tool==='p'||ed.tool==='e':o.y===y&&ed.tool!=='p')));
    if('bsjuvd'.includes(ed.tool))ed.items.push({t:ed.tool,x,y});else if(ed.tool==='p')ed.items.push({t:'p',x,f:ed.pf});
    draw()};
  cv.onpointerdown=e=>{drag=true;put(e)};cv.onpointermove=e=>{if(drag&&ed.tool!=='p')put(e)};cv.onpointerup=cv.onpointerleave=()=>{drag=false};
  const T=(t,l)=>[l+(t==='p'?': '+CH[ed.pf].n:''),()=>{if(ed.tool==='p'&&t==='p')ed.pf=(ed.pf+1)%5;ed.tool=t;edui()},ed.tool===t?0:1];
  const save=()=>{ed.n=ed.n.trim().slice(0,32)||'Mój poziom';const L=edLevel();L.n=ed.n;
    if(ed.idx<0){custom.push(L);ed.idx=custom.length-1;stats.mapsCreated=(stats.mapsCreated||0)+1}else custom[ed.idx]=L;
    ed.n=L.n;checkAchievements();sv('d3custom',custom);flash('#7dff9a',.3);edui()};
  scr('EDYTOR','Klikaj lub przeciągaj po siatce. Pierwsze 8 kratek jest wolnych, start to Kostka. Portal zmienia formę, kliknij Portal ponownie, by wybrać inną.',
   [T('s','Kolec'),T('v','Kolec w dół'),T('b','Blok'),T('j','Trampolina'),T('u','Mega'),T('d','Deko'),T('p','Portal'),T('e','Gumka'),['◀',()=>{ed.off=Math.max(0,ed.off-10);edui()},1],['▶',()=>{ed.off+=10;edui()},1],
    ['Test',()=>startLevel(edLevel()),1],['Zapisz',save,1],...(ed.idx>=0?[['Usuń',()=>{custom.splice(ed.idx,1);best.splice(LV.length+ed.idx,1);sv('d3custom',custom);ed=null;myLevels()},1]]:[]),
    ['Nowy',()=>{ed=null;editor()},1],['Wyjdź',main,1]],w);
  ov.style.cssText='padding:6px;justify-content:flex-start';const h=ov.querySelector('h1');h.style.fontSize='20px';h.style.textShadow='none';
  ov.querySelectorAll('p').forEach(p=>{p.style.margin='2px';p.style.fontSize='13px';p.style.maxWidth='none'});
  ov.querySelectorAll('button').forEach(b=>{b.style.fontSize='15px';b.style.padding='6px 12px'});
  const rw=ov.querySelector('.row');rw.style.margin='4px 0';ov.insertBefore(rw,w);
  draw()}
function pause(){persistProfile();stopMusic();state='pause';$('touchBtn').classList.add('hide');$('mbtn').classList.add('hide');scr('PAUZA',LVL.n+' · '+cur+'%',[['Wznów',resume],['Restart',again,1],[lvl<0?'Edytor':'Poziomy',back,1],['Menu główne',main,1]])}
function resume(){ov.classList.add('hide');$('pbtn').classList.remove('hide');$('mbtn').classList.remove('hide');$('touchBtn').classList.remove('hide');hold=false;state='play';if(musicEnabled)playMusic(musicTrack);updateMusicButton()}
const again=()=>startLevel(lvl>=0?lvl:LVL),back=()=>lvl<0?editor():levels();
function startLevel(x){
  lockLandscape();
  const L=typeof x==='object'?x:ALL()[x];lvl=typeof x==='object'?-1:x;LVL=L;
  stats.attempts=(stats.attempts||0)+1;
  musicTrack=Math.max(0,ALL().indexOf(L));
  build(L);Object.assign(P,{x:0,y:0,vy:0,rot:0,jumps:0});curForm=formAt(0);mkPlayer(curForm);att=1;hudForm();
  parts.forEach(p=>scene.remove(p));parts.length=0;trail.forEach(p=>scene.remove(p));trail.length=0;
  hold=false;pressed=false;cur=0;resume();pop(L.n,'#fff4e0');
}
function respawn(tx){
  const ok=x=>!obs.some(o=>o.x<x+3.5&&o.x+o.w>x-.5&&o.y0<2.5);
  let x=tx;while(x>0&&!ok(x))x-=.5;x=Math.max(0,x);
  Object.assign(P,{x,y:0,vy:0,rot:0,jumps:0});curForm=formAt(x+.5);mkPlayer(curForm);hudForm();
  hold=false;pressed=false;flash('#7dff9a',.35);
}
function end(won){
  stopMusic();$('touchBtn').classList.add('hide');$('mbtn').classList.add('hide');playSfx(won?'complete':'destroy');
  const pc=won?100:Math.floor(P.x/LEN*100);
  stats.bestPercent=Math.max(stats.bestPercent||0,pc);
  if(!won){stats.deaths=(stats.deaths||0)+1;att++;player.visible=false;burst(pcol(),40);flash('#ff2040',.5);shake=.6}
  else stats.levelsCompleted=(stats.levelsCompleted||0)+1;
  checkAchievements();
  state='over';$('pbtn').classList.add('hide');
  if(won){flash('#ffffff',.8);burst(pcol(),60)}
  else if(lvl>=0&&pc>(best[lvl]||0)){best[lvl]=pc;saveBest()}
  if(won&&lvl>=0){best[lvl]=100;saveBest()}
  persistProfile();
  const next=won&&lvl>=0&&lvl<ALL().length-1;
  setTimeout(()=>{if(state!=='over')return;
    scr(won?'META!':'ROZBITY',won?'Poziom ukończony. Podejścia: '+att+'.':'Dotarłeś do '+pc+'%.'+(lvl>=0?' Rekord: '+(best[lvl]||0)+'%.':''),
    [...(next?[['Następny poziom',()=>startLevel(lvl+1)]]:[]),[won?'Zagraj jeszcze raz':'Spróbuj ponownie',again,next?1:0],[lvl<0?'Edytor':'Poziomy',back,1],['Menu główne',main,1]])},won?300:700);
}

// physics
const formAt=x=>(segs.find(s=>x>=s.a&&x<s.b)||segs[segs.length-1]).f;
function step(dt){
  P.x+=SP*dt;stats.distance=(stats.distance||0)+SP*dt;
  const nf=formAt(P.x+.5);if(nf!==curForm){curForm=nf;stats.portals=(stats.portals||0)+1;playSfx('portal',nf);mkPlayer(nf);P.rot=0;hudForm();flash(hx(CH[nf].c),.55);pop(CH[nf].n,hx(CH[nf].c));burst(CH[nf].c,50);kick=1}
  const C=CH[curForm],prev=P.y,fly=!!C.fly;
  if(fly)P.vy=clamp(P.vy+(hold?36:-36)*dt,-10,10);else P.vy+=C.g*dt;
  P.y+=P.vy*dt;
  if(fly&&P.y>8){P.y=8;P.vy=Math.min(P.vy,0)}
  const x0=P.x+.12,x1=P.x+.88;let floor=0;
  for(const o of obs){
    if(o.x>P.x+3||o.x+o.w<P.x-1)continue;
    if(o.t==='b'){
      if(x1>o.x&&x0<o.x+o.w){
        if(prev>=o.y1-.2&&P.y<=o.y1)floor=Math.max(floor,o.y1);
        else if(P.y<o.y1-.05&&P.y+1>o.y0+.05)return end(false);
      }
    }else if(o.t==='j'){if(x1>o.x&&x0<o.x+1&&P.y<o.y1&&P.y+.5>o.y0){stats.trampolines=(stats.trampolines||0)+1;P.vy=o.pw;P.jumps=1;pressed=false;burst(0xffe14a,12);kick=.5}
    }else if(o.t==='v'){if(P.y<o.y0+1&&P.y+1>o.y0+.35&&x1>o.x+.2&&x0<o.x+.8)return end(false)
    }else if(P.y<o.y0+.5&&P.y+.9>o.y0&&x1>o.x+.3&&x0<o.x+.7)return end(false);
  }
  if(P.y<=floor&&P.vy<=0){
    P.y=floor;P.vy=0;P.jumps=0;
    P.rot=Math.round(P.rot/(Math.PI/2))*(Math.PI/2);
    if(hold&&!fly){stats.jumps=(stats.jumps||0)+1;P.vy=C.j;P.jumps=1;pressed=false}
  }else if(!fly){
    if(P.jumps===0)P.jumps=1;
    P.rot-=dt*7.2;
    if(C.dj&&pressed&&P.jumps<2){stats.jumps=(stats.jumps||0)+1;stats.doubleJumps=(stats.doubleJumps||0)+1;P.vy=C.j;P.jumps=2;pressed=false;burst(CH[curForm].c,10)}
  }else P.rot=0;
  if(P.x>=LEN)end(true);
}

let last=performance.now(),tt=0,statsSaveTick=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/1000,.05);last=now;tt+=dt;
  if(state==='play'){
    stats.playSeconds=(stats.playSeconds||0)+dt;if(CH[curForm].fly)stats.flightSeconds=(stats.flightSeconds||0)+dt;
    for(let i=0;i<3&&state==='play';i++)step(dt/3);
    checkAchievements();statsSaveTick+=dt;if(statsSaveTick>=5){persistProfile();statsSaveTick=0}
    pressed=false;
    if(skin.t!==2&&Math.random()<(skin.t===3?.8:.5)&&player.visible){const size=skin.t===3?.22:skin.t===4?.55:.4;
      const shade=skin.t===1?new THREE.Color().setHSL(tt*.8%1,1,.6):skin.t===3?(Math.random()<.5?0xffd23d:0xff3d81):skin.t===4?0x18e0ff:pcol();
      const t=new THREE.Mesh(new THREE.BoxGeometry(size,size,size),new THREE.MeshBasicMaterial({color:shade,transparent:true,opacity:skin.t===4?.3:skin.t===3?.85:.7}));
      t.position.set(P.x+.5,P.y+.5,0);scene.add(t);trail.push(t)}
    cur=Math.min(100,Math.floor(P.x/LEN*100));$('pct').textContent=cur+'%';$('fill').style.width=cur+'%';
  }
  $('hud').style.visibility=state==='menu'?'hidden':'visible';
  if(state==='menu'){P.x=0;P.y=0;P.rot=0;P.vy=0}
  if(player){player.position.set(P.x+.5,P.y+.5,0);
    player.rotation.z=CH[curForm].fly?clamp(P.vy*.06,-.5,.5):P.rot}
  const px=P.x+.5;
  cam.position.lerp(new THREE.Vector3(px-6.5,4.2+Math.max(0,P.y-1)*.35,8),Math.min(1,dt*8));
  cam.lookAt(px+5,1.6+Math.max(0,P.y)*.2,0);
  for(let i=trail.length-1;i>=0;i--){const t=trail[i];t.material.opacity-=dt*2;t.scale.multiplyScalar(1-dt*2);
    if(t.material.opacity<=0){scene.remove(t);trail.splice(i,1)}}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.userData.v.y-=19*dt;p.position.addScaledVector(p.userData.v,dt);p.rotation.x+=dt*5;
    if(p.position.y<-5){scene.remove(p);parts.splice(i,1)}}
  mats.spike.emissiveIntensity=.6+.4*Math.sin(tt*4)+.4;
  portals.forEach(t=>t.scale.setScalar(1+.05*Math.sin(tt*6)));
  if(shake>0){cam.position.x+=(Math.random()-.5)*shake;cam.position.y+=(Math.random()-.5)*shake;shake=Math.max(0,shake-dt*2)}
  kick=Math.max(0,kick-dt*3);cam.fov=60+kick*14;cam.updateProjectionMatrix();
  renderer.render(scene,cam);
}
LVL=LV[0];build(LV[0]);mkPlayer(0);loadLocalProfile();requestAnimationFrame(loop);
</script></body></html>
